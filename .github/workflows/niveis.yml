name: salvar níveis de fluência

# O botão "Salvar no radar" da aba "Minhas ferramentas" abre uma issue "niveis: ..." já preenchida.
# Só issues abertas pelo DONO do repositório são aplicadas.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  aplicar:
    if: startsWith(github.event.issue.title, 'niveis') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Aplicar níveis e recalcular compatibilidades
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/aplicar_niveis.py
      - name: Salvar
        run: |
          git config user.name "linkage-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add profile/niveis.json data/
          git diff --cached --quiet && exit 0
          git commit -m "níveis de fluência atualizados pelo site"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: Fechar a issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "✅ Níveis salvos e compatibilidades recalculadas. O site atualiza em ~1 minuto."

  site:
    needs: aplicar
    uses: ./.github/workflows/pages.yml
