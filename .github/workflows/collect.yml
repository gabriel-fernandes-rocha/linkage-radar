name: coletar

on:
  schedule:
    - cron: "17 23 * * *"  # 20:17 BRT. O GitHub atrasa ~6h aqui: na prática roda ~02h e termina antes das 07h
    - cron: "47 2 * * *"   # 23:47 BRT: repescagem (só coleta se a de cima não tiver rodado)
  workflow_dispatch:
    inputs:
      varredura_completa:
        description: "Buscar vagas com todos os termos (gasta ~22 buscas SerpAPI)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  models: read      # GitHub Models: juiz reserva grátis, sem chave extra

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar e filtrar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python src/main_collect.py ${{ github.event_name == 'schedule' && '--se-ainda-nao-coletou' || '' }} ${{ inputs.varredura_completa && '--varredura-completa' || '' }}
      - name: Commit dos dados
        run: |
          git config user.name "linkage-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "radar: edição $(TZ=America/Sao_Paulo date -d tomorrow +%F)"
          # até 3 tentativas; em conflito, prevalecem os dados novos desta coleta
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done; exit 1

  deploy:
    needs: collect
    uses: ./.github/workflows/pages.yml
