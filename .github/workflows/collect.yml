name: coletar

on:
  schedule:
    - cron: "17 1 * * *"   # 22:17 BRT (o GitHub costuma atrasar; começamos cedo)
    - cron: "47 4 * * *"   # 01:47 BRT: repescagem, só roda se a de cima não tiver rodado
  workflow_dispatch:
    inputs:
      varredura_completa:
        description: "Buscar vagas com todos os termos (gasta ~22 buscas SerpAPI)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar e filtrar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python src/main_collect.py ${{ github.event_name == 'schedule' && '--se-ainda-nao-coletou' || '' }} ${{ inputs.varredura_completa && '--varredura-completa' || '' }}
      - name: Commit dos dados
        run: |
          git config user.name "linkage-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "radar: edição $(TZ=America/Sao_Paulo date -d tomorrow +%F)"
          git pull --rebase && git push

  deploy:
    needs: collect
    uses: ./.github/workflows/pages.yml
