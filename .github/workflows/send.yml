name: enviar

# O agendamento grátis do GitHub atrasa ~6h neste repositório. Por isso o envio começa logo que a
# coleta termina (de madrugada) e ESPERA rodando até send_time (config.yaml). Um job em execução
# acorda na hora certa. Os horários abaixo são só rede de segurança. Nunca envia 2x no dia.
on:
  workflow_run:
    workflows: [coletar]
    types: [completed]
  schedule:
    - cron: "7 22 * * *"   # 19:07 BRT do dia anterior: entra na fila e espera (rede de segurança)
    - cron: "7 10 * * *"   # 07:07 BRT
    - cron: "7 14 * * *"   # 11:07 BRT
  workflow_dispatch:
    inputs:
      forcar:
        description: "Enviar agora mesmo (ignora horário e o 'já enviado hoje')"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: enviar
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Esperar o horário de envio
        id: espera
        if: ${{ !inputs.forcar }}
        run: python scripts/wait_until_send.py
      - name: Reagendar (faltava mais de 5h)
        if: steps.espera.outputs.acao == 'reagendar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run send.yml --ref main
      - name: Atualizar dados
        if: steps.espera.outputs.acao == 'enviar' || inputs.forcar
        run: git pull --quiet --rebase
      - name: Enviar WhatsApp
        if: steps.espera.outputs.acao == 'enviar' || inputs.forcar
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          BOOK_URL: ${{ secrets.BOOK_URL }}   # opcional: link do SEU PDF do livro (Dropbox/OneDrive), nunca público
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        run: python src/main_send.py ${{ inputs.forcar && ' ' || '--agendado' }}
      - name: Registrar envio (sempre, inclusive se falhar: a próxima tentativa continua de onde parou)
        if: always() && steps.espera.outputs.acao == 'enviar'
        run: |
          git config user.name "linkage-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sent.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "radar: progresso do envio $(TZ=America/Sao_Paulo date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
