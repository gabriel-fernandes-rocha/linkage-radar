# Linkage Radar — configuração (edite à vontade, sem mexer no código)
timezone: America/Sao_Paulo
send_time: "07:00"            # o envio espera rodando até este horário (scripts/wait_until_send.py)
collect_time: "23:00"
curriculum_start: 2026-10-02   # programa de 52 semanas (curriculum/plan.py)

whatsapp:
  enabled: true
  provider: callmebot       # callmebot | twilio
  min_compat: 0.25             # só manda no WhatsApp vagas com compatibilidade >= 25%
  # número e apikey ficam em GitHub Secrets: WHATSAPP_PHONE, CALLMEBOT_APIKEY

llm:
  provider: anthropic       # anthropic | gemini
  model: claude-haiku-4-5   # o modelo mais barato da Anthropic ($1 / $5 por milhão de tokens)
  min_confidence: 0.8       # só entra no relatório se o juiz der >= 0.8
  batch_size: 8             # itens julgados por chamada (menos chamadas = mais barato)
  max_items_per_day: 80     # teto de itens enviados ao LLM por dia (trava de custo)
  extract_model: claude-sonnet-5   # lê as vagas aprovadas (poucas/dia) com precisão: requisitos, local, visto
  writer_model: claude-sonnet-5    # pílulas de mercado e análise de perfil

web_search:                 # usado para LinkedIn e eventos (fontes sem API)
  linkedin_weekdays: [0, 1, 2, 3, 4, 5, 6]   # 0=segunda ... 6=domingo
  linkedin_max_uses: 2      # buscas por dia (US$ 0,01 cada)
  events_weekdays: [0, 3]   # eventos mudam pouco: segunda e quinta
  events_max_uses: 3

serpapi:                    # plano grátis ~250 buscas/mês: LinkedIn ~30 + posts de vagas ~60 + eventos ~8 + vagas ~90 + rede ~60
  jobs_searches_per_day: 2
  jobs_pages_per_term: 2

network:
  max_people: 5             # novas pessoas por dia
  max_companies: 3          # novas empresas por dia
  companies_weekdays: [0, 2, 4]   # busca empresas seg, qua e sex (economia de buscas)

open_jobs:
  max_age_days: 60          # vaga sai da lista de abertas depois disso, mesmo sem confirmação de fechamento

# Seu perfil — o juiz usa isto para dar a nota de encaixe das vagas
perfil: >-
  Engenheiro de dados (instituto de pesquisa em saúde pública, desde 2024) especializado em record linkage, resolução de entidades
  e matching determinístico/probabilístico em produção com bilhões de registros (saúde, proteção social,
  registro civil). Pipeline completo: ingestão, normalização, blocking, scoring, classificação e QA.
  Stack: Spark, Python, SQL, Elasticsearch, Splink, RapidFuzz, scikit-learn. Mestrado em Ciência da
  Computação (UFBA) em andamento; MBA Big Data. Inglês intermediário, espanhol básico.
  Mora em Salvador-BA: aceita remoto (Brasil ou mundo) e presencial/híbrido no Brasil.

# Perfil estruturado: usado no cálculo determinístico da compatibilidade (src/compat.py)
perfil_estruturado:
  experiencia_dados_desde: 2024-01-01
  pais: Brasil
  cidade: Salvador
  ingles: intermediario
  habilidades: [Python, PySpark, Spark, SQL, Elasticsearch, Splink, RapidFuzz, scikit-learn, Jupyter,
    Record Linkage, Entity Resolution, Deduplication, Probabilistic Matching, Deterministic Matching,
    Fellegi-Sunter, Blocking, Fuzzy Matching, Data Quality, Data Pipelines, ETL, Data Normalization,
    Big Data, Data Warehouse, Data Lake, Business Intelligence]

limits:
  max_jobs: 10
  max_events: 5
  max_papers: 5
  max_linkedin: 5

site_url: "https://gabriel-fernandes-rocha.github.io/linkage-radar/"

